[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geodesic_interpolate"
version = "0.0.1"
description = "Interpolation and smoothing of reaction paths with geodesics in redundant internal coordinates."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
  { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]

dependencies = [
  "numpy>=1.26.4",
  "scipy>=1.16.0",
  "ase>=3.25.0",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/LouieSlocombe/geodesic_interpolate"
Repository = "https://github.com/LouieSlocombe/geodesic_interpolate"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["geodesic_interpolate", "geodesic_interpolate.*"]

[tool.setuptools.package-data]
"geodesic_interpolate" = ["data/*"]
