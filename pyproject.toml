[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geodesic_interpolate"
version = "0.0.1"
description = "Interpolation and smoothing of reaction paths with geodesics in redundant internal coordinates."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

authors = [
  { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]

keywords = [
  "chemistry",
  "computational chemistry",
  "reaction path",
  "interpolation",
  "geodesic",
  "nudged elastic band",
  "ase",
]

dependencies = [
  "numpy>=1.26.4",
  "scipy>=1.16.0",
  "ase>=3.25.0",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/LouieSlocombe/geodesic_interpolate"
Repository = "https://github.com/LouieSlocombe/geodesic_interpolate"

[tool.setuptools.packages.find]
where = ["."]
include = ["geodesic_interpolate", "geodesic_interpolate.*"]
